<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/assets/favicons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/favicons/site.webmanifest" />

  <title>Interactive Learning Roadmap - WorkSim</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../../../css/output.css" />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <script src="/js/alert.js" defer></script>
  <script src="/js/shared.js" defer></script>
  <script src="../../../js/roadmap-frontend.js" defer></script>
  <script src="../../../js/xp-widget.js" defer></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      height: 8px;
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 20px;
    }

    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #334155;
    }

    /* Animation for SVG path drawing */
    .path-draw {
      stroke-dashoffset: 1000;
      animation: dash 1.5s ease-out forwards;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(200%);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>

<body
  class="overflow-x-hidden bg-[radial-gradient(circle_at_10%_-10%,#e7ecff_0%,#f8fafc_45%)] text-slate-900 transition-colors duration-300 dark:bg-[radial-gradient(circle_at_10%_-10%,#1b2840_0%,#0b1220_45%)] dark:text-slate-100">

  <!-- Navbar Placeholder -->
  <div id="navbar-placeholder"></div>

  <main class="min-h-[calc(100vh-88px)] relative flex flex-col items-center">
    <!-- Hero / Title -->
    <section class="relative w-[98vw] max-w-330 px-4 pt-12 pb-8 text-center mt-4">
      <!-- Back Navigation – di atas konten hero pada mobile, di pojok kiri pada desktop -->
      <div class="w-full flex justify-start mb-8 sm:mb-0 sm:absolute sm:left-4 sm:top-12">
        <a href="../"
          class="group inline-flex items-center gap-2.5 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 shadow-sm hover:border-brand-300 hover:text-brand-500 dark:hover:border-brand-600 dark:hover:text-brand-400 hover:shadow-md transition-all duration-200">
          <span
            class="grid h-6 w-6 place-items-center rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-brand-100 dark:group-hover:bg-brand-900/50 transition-colors">
            <i class="fa-solid fa-arrow-left text-[10px]"></i>
          </span>
          Semua Roadmap
        </a>
      </div>

      <!-- Hero Content – tetap di tengah -->
      <div
        class="inline-flex items-center gap-2 rounded-full border border-brand-100 bg-brand-50 px-4 py-2 text-xs font-bold uppercase tracking-widest text-brand-500 dark:border-brand-900 dark:bg-brand-900/20 mb-6 shadow-sm">
        <i class="fa-solid fa-code-branch"></i> Learning Path
      </div>
      <h1
        class="font-display text-[clamp(2rem,4vw,3.5rem)] leading-tight tracking-tight text-slate-900 dark:text-white mb-4">
        Frontend <span class="text-brand-500">Developer</span>
      </h1>
      <p class="mx-auto max-w-2xl text-slate-500 dark:text-slate-400">
        Panduan komprehensif bercabang untuk menguasai ekosistem Frontend. Klik pada setiap modul (baik utama maupun
        percabangan) untuk melihat detail materi dan sumber referensi.
      </p>
    </section>

    <!-- Roadmap Timeline Container -->
    <section
      class="w-full px-4 pb-24 flex justify-center overflow-x-hidden sm:overflow-x-auto custom-scrollbar relative">
      <div class="min-w-[1000px] w-[1000px] shrink-0 origin-top scale-[0.45] sm:scale-100 relative py-10"
        id="roadmap-container">
        <!-- Center Vertical Solid Line -->
        <div class="absolute left-1/2 top-10 bottom-28 w-[2px] -translate-x-1/2 bg-[#5e82f4] dark:bg-slate-600 z-0">
        </div>

        <!-- SVG for Curved Dotted Lines -->
        <svg id="svg-lines" class="absolute inset-0 w-full h-full pointer-events-none z-0"></svg>

        <!-- Nodes Container -->
        <div id="nodes-container" class="relative z-10 flex flex-col gap-8">
          <!-- Rendered via JS -->
        </div>

      </div>
    </section>
  </main>

  <!-- Side Panel Overlay -->
  <div id="side-panel-overlay" onclick="closePanel()"
    class="fixed inset-0 z-40 bg-slate-900/30 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
  </div>

  <!-- Side Panel Drawer -->
  <aside id="side-panel"
    class="fixed right-0 top-0 z-50 h-full w-full max-w-md translate-x-full transform border-l border-white/50 bg-white/95 p-6 shadow-[[-20px_0_40px_rgba(0,0,0,0.1)]] backdrop-blur-xl transition-transform duration-300 dark:border-slate-700/50 dark:bg-slate-900/95 sm:p-8 flex flex-col">
    <!-- Panel Header -->
    <div class="flex items-center justify-between border-b border-slate-200 pb-4 dark:border-slate-800">
      <div class="flex gap-5">
        <button id="materi-tab-btn" onclick="switchPanelTab('materi')"
          class="font-semibold text-brand-500 border-b-2 border-brand-500 pb-1 flex items-center gap-2">
          <i class="fa-solid fa-layer-group"></i> Materi
        </button>
        <button id="example-tab-btn" onclick="switchPanelTab('example')"
          class="font-semibold text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors pb-1 flex items-center gap-2">
          <i class="fa-solid fa-code"></i> Example
        </button>
      </div>
      <button onclick="closePanel()"
        class="grid h-8 w-8 place-items-center rounded-full bg-slate-100 text-slate-500 transition-colors hover:bg-slate-200 hover:text-slate-800 dark:bg-slate-800 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Panel Body -->
    <div class="flex-1 overflow-y-auto py-6 pr-2 custom-scrollbar" id="panel-content-wrapper">
      <div id="panel-content-materi" class="block animate-fade-in">
        <!-- Injected via JS -->
      </div>
      <div id="panel-content-example" class="hidden animate-fade-in">
        <!-- Injected via JS -->
      </div>
    </div>
  </aside>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>


</body>

</html>
