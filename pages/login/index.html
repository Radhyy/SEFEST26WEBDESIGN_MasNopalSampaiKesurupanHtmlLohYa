<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login - WorkSim</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../../css/output.css" />

  <script src="../../js/shared.js" defer></script>  
  <script src="../../js/login.js" defer></script>
  <style>
    /* Animated Gradient Background */
    .bg-animate {
      background: linear-gradient(-45deg, #eef3ff, #f8fafc, #e7ecff, #ffffff);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    .dark .bg-animate {
      background: linear-gradient(-45deg, #0f1f5c, #0b1220, #1b2840, #1d43b4);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Floating Elements */
    .floating-icon {
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(5deg);
      }

      100% {
        transform: translateY(0px) rotate(0deg);
      }
    }
  </style>

</head>

<body
  class="bg-animate min-h-screen flex flex-col font-sans text-slate-900 dark:text-slate-100 transition-colors duration-300 relative overflow-x-hidden">

  <div id="navbar-placeholder"></div>

  <!-- Logo Dekorasi Kanan Tengah -->
  <img src="/assets/logo/WorksimLogo.png" alt="" class="absolute top-1/2 right-0 -translate-y-1/2 translate-x-1/2 w-150 lg:w-200 opacity-30 pointer-events-none dark:hidden" />
  <img src="/assets/logo/WorksimLogo.png" alt="" class="absolute top-1/2 right-0 -translate-y-1/2 translate-x-1/2 w-150 lg:w-200 opacity-30 pointer-events-none hidden dark:block" />

  <!-- Konten Utama: Form Login -->
  <main class="grow flex items-center justify-center p-4 relative z-10">
    <div class="w-full max-w-md">

      <!-- Card Container dengan Glassmorphism -->
      <div
        class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/50 dark:border-slate-700/50 p-8 sm:p-10 transform transition-all hover:scale-[1.01]">

        <!-- Header -->
        <div class="text-center mb-8">
          <h2 class="font-display text-3xl font-bold text-slate-900 dark:text-white mb-2">Selamat Datang Kembali</h2>
          <p class="text-slate-500 dark:text-slate-400 text-sm">Masuk untuk melanjutkan perjalanan karirmu di WorkSim.
          </p>
        </div>

        <!-- Form -->
        <form id="loginForm" class="space-y-6">
          <!-- Input Email -->
          <div>
            <label for="email" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Alamat
              Email</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <input type="email" id="email" name="email" required placeholder="budi@worksim.id" value="budi@worksim.id"
                class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm" />
            </div>
          </div>

          <!-- Input Password -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Kata
                Sandi</label>
              <a href="#"
                class="text-sm font-semibold text-brand-500 hover:text-brand-600 dark:hover:text-brand-400 transition-colors">Lupa
                sandi?</a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-lock"></i>
              </div>
              <input type="password" id="password" name="password" required placeholder="••••••••" value="password123"
                class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm" />
              <!-- Mata untuk toggle password -->
              <div onclick="togglePassword('password', this)"
                class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
                <i class="fa-regular fa-eye"></i>
              </div>
            </div>
          </div>

          <!-- Tombol Submit -->
          <div>
            <button type="submit"
              class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-lg shadow-brand-500/30 text-sm font-bold text-white bg-brand-500 hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all hover:-translate-y-0.5">
              <span>Masuk Sekarang</span>
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </form>

        <!-- Divider -->
        <div class="mt-8 relative flex items-center">
          <div class="grow border-t border-slate-200 dark:border-slate-700"></div>
          <span class="shrink-0 mx-4 text-slate-400 text-sm">Atau masuk dengan</span>
          <div class="grow border-t border-slate-200 dark:border-slate-700"></div>
        </div>

        <!-- Social Login -->
        <div class="mt-6 grid grid-cols-2 gap-4">
          <button
            class="flex items-center justify-center gap-2 px-4 py-2.5 border border-slate-200 dark:border-slate-700 rounded-xl bg-white/50 dark:bg-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-sm transition-colors shadow-sm">
            <i class="fa-brands fa-google text-red-500"></i> Google
          </button>
          <button
            class="flex items-center justify-center gap-2 px-4 py-2.5 border border-slate-200 dark:border-slate-700 rounded-xl bg-white/50 dark:bg-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-sm transition-colors shadow-sm">
            <i class="fa-brands fa-github"></i> GitHub
          </button>
        </div>

      </div> <!-- End Card -->

      <!-- Link Daftar -->
      <p class="mt-8 text-center text-sm text-slate-600 dark:text-slate-400">
        Belum punya akun?
        <a href="register.html"
          class="font-bold text-brand-500 hover:text-brand-600 dark:hover:text-brand-400 transition-colors border-b border-transparent hover:border-brand-500 pb-0.5">Daftar
          Gratis</a>
      </p>

    </div>
  </main>

</body>

</html>
