<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/assets/favicons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/favicons/site.webmanifest" />

  <title>Daftar - WorkSim</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../../css/output.css" />

  <script src="../../js/shared.js" defer></script>
  <script src="../../js/register.js" defer></script>

  <style>
    /* Animated Gradient Background */
    .bg-animate {
      background: linear-gradient(-45deg, #eef3ff, #f8fafc, #e7ecff, #ffffff);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    .dark .bg-animate {
      background: linear-gradient(-45deg, #0f1f5c, #0b1220, #1b2840, #1d43b4);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Floating Elements */
    .floating-icon {
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(5deg);
      }

      100% {
        transform: translateY(0px) rotate(0deg);
      }
    }
  </style>

</head>

<body
  class="bg-animate min-h-screen flex flex-col font-sans text-slate-900 dark:text-slate-100 transition-colors duration-300 relative overflow-x-hidden">

  <div id="navbar-placeholder"></div>

  <!-- Logo Dekorasi Kanan Tengah -->
  <img src="/assets/logo/WorksimLogo.webp" alt=""
    class="absolute top-1/2 right-4 hidden -translate-y-1/2 opacity-15 pointer-events-none sm:block sm:w-80 lg:w-120 dark:hidden" />
  <img src="/assets/logo/WorksimLogo.webp" alt=""
    class="absolute top-1/2 right-4 hidden -translate-y-1/2 opacity-15 pointer-events-none dark:sm:block sm:w-80 lg:w-120" />

  <!-- Konten Utama: Form Register -->
  <main class="grow flex items-center justify-center px-4 py-8 sm:py-10 relative z-10">
    <div class="w-full max-w-md">

      <!-- Card Container dengan Glassmorphism -->
      <div
        class="bg-white/85 dark:bg-slate-900/85 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/50 dark:border-slate-700/50 p-5 sm:p-8 lg:p-10 transform transition-all hover:scale-[1.01]">

        <!-- Header -->
        <div class="text-center mb-8">
          <h2 class="font-display text-3xl font-bold text-slate-900 dark:text-white mb-2">Mulai Perjalananmu</h2>
          <p class="text-slate-500 dark:text-slate-400 text-sm">Buat akun WorkSim secara gratis sekarang.</p>
        </div>

        <!-- Form -->
        <form id="registerForm" class="space-y-5">
          <!-- Input Nama Lengkap -->
          <div>
            <label for="name" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Nama
              Lengkap</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i class="fa-regular fa-user"></i>
              </div>
              <input type="text" id="name" name="name" required placeholder="Budi Santoso"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm" />
            </div>
          </div>

          <!-- Input Email -->
          <div>
            <label for="email" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Alamat
              Email</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <input type="email" id="email" name="email" required placeholder="nama@email.com"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm" />
            </div>
          </div>

          <!-- Input Password -->
          <div>
            <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Kata
              Sandi</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-lock"></i>
              </div>
              <input type="password" id="password" name="password" required placeholder="Minimal 8 karakter"
                minlength="8"
                class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm" />
              <!-- Mata untuk toggle password -->
              <div onclick="togglePassword('password', this)"
                class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
                <i class="fa-regular fa-eye"></i>
              </div>
            </div>
            <p class="mt-1.5 text-[0.65rem] text-slate-500 dark:text-slate-400">Pastikan gunakan kombinasi huruf dan
              angka yang aman.</p>
          </div>

          <!-- Term & Condition Checkbox -->
          <div class="flex items-start gap-2 mt-2">
            <div class="flex items-center h-5 mt-0.5">
              <input id="terms" name="terms" type="checkbox" required
                class="w-4 h-4 border border-slate-300 rounded bg-slate-50 focus:ring-3 focus:ring-brand-300 dark:bg-slate-700 dark:border-slate-600 dark:focus:ring-brand-600 dark:ring-offset-slate-800 cursor-pointer">
            </div>
            <label for="terms" class="text-xs text-slate-600 dark:text-slate-400 cursor-pointer leading-tight">
              Saya setuju dengan <a href="#" class="inline-flex min-h-8 items-center font-semibold text-brand-500 hover:underline">Syarat & Ketentuan</a>
              serta <a href="#" class="inline-flex min-h-8 items-center font-semibold text-brand-500 hover:underline">Kebijakan Privasi</a> yang berlaku.
            </label>
          </div>

          <!-- Tombol Submit -->
          <div class="pt-2">
            <button type="submit"
              class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-lg shadow-brand-500/30 text-sm font-bold text-white bg-brand-500 hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all hover:-translate-y-0.5">
              <span>Buat Akun</span>
              <i class="fa-solid fa-user-plus"></i>
            </button>
          </div>
        </form>

        <!-- Divider -->
        <div class="mt-6 relative flex items-center">
          <div class="grow border-t border-slate-200 dark:border-slate-700"></div>
          <span class="shrink-0 mx-4 text-slate-400 text-sm">Atau daftar dengan</span>
          <div class="grow border-t border-slate-200 dark:border-slate-700"></div>
        </div>

        <!-- Social Login -->
        <div class="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4">
          <button
            class="flex items-center justify-center gap-2 px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-xl bg-white/50 dark:bg-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-sm transition-colors shadow-sm">
            <i class="fa-brands fa-google text-red-500"></i> Google
          </button>
          <button
            class="flex items-center justify-center gap-2 px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-xl bg-white/50 dark:bg-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-sm transition-colors shadow-sm">
            <i class="fa-brands fa-github"></i> GitHub
          </button>
        </div>

      </div> <!-- End Card -->

      <!-- Link Login -->
      <p class="mt-8 text-center text-sm text-slate-600 dark:text-slate-400">
        Sudah punya akun?
        <a href="../login/"
          class="inline-flex min-h-9 items-center font-bold text-brand-500 hover:text-brand-600 dark:hover:text-brand-400 transition-colors border-b border-transparent hover:border-brand-500 pb-0.5">Masuk
          di sini</a>
      </p>

    </div>
  </main>

</body>

</html>
