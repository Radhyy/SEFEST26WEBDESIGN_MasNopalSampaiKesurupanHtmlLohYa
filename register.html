<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar - WorkSim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Sora", "sans-serif"],
          },
          colors: {
            brand: { 50: "#eef3ff", 100: "#dbe5ff", 500: "#2f5bd3", 600: "#1d43b4" },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
  <style>
    /* Animated Gradient Background */
    .bg-animate {
      background: linear-gradient(-45deg, #eef3ff, #f8fafc, #e7ecff, #ffffff);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    .dark .bg-animate {
      background: linear-gradient(-45deg, #0f1f5c, #0b1220, #1b2840, #1d43b4);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* Floating Elements */
    .floating-icon {
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
  </style>
  <script>
    // Inisialisasi Dark Mode
    if (localStorage.getItem("theme") === "dark" || (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");
    }
    function toggleTheme() {
      if (document.documentElement.classList.contains("dark")) {
        document.documentElement.classList.remove("dark");
        localStorage.setItem("theme", "light");
      } else {
        document.documentElement.classList.add("dark");
        localStorage.setItem("theme", "dark");
      }
    }
  </script>
</head>
<body class="bg-animate min-h-screen flex flex-col font-sans text-slate-900 dark:text-slate-100 transition-colors duration-300 relative overflow-hidden">

  <!-- Floating Decorative Icons -->
  <div class="absolute top-20 right-[10%] opacity-20 dark:opacity-10 floating-icon text-brand-500 text-6xl">
    <i class="fa-solid fa-code-branch"></i>
  </div>
  <div class="absolute bottom-20 left-[10%] opacity-20 dark:opacity-10 floating-icon text-brand-500 text-6xl" style="animation-delay: -3s;">
    <i class="fa-solid fa-laptop-code"></i>
  </div>
  <div class="absolute top-1/3 left-[20%] opacity-10 dark:opacity-5 floating-icon text-amber-500 text-5xl" style="animation-delay: -1.5s;">
    <i class="fa-solid fa-star"></i>
  </div>

  <!-- Navbar Minimalis -->
  <header class="absolute top-0 w-full z-50">
    <nav class="mx-auto flex max-w-7xl items-center justify-between p-6 lg:px-8" aria-label="Global">
      <div class="flex lg:flex-1">
        <a href="index.html" class="-m-1.5 p-1.5">
          <span class="sr-only">WorkSim</span>
          <img class="h-8 w-auto dark:hidden" src="assets/logo/Logo%20WorkSim.png" alt="WorkSim Logo" />
          <img class="h-8 w-auto hidden dark:block" src="assets/logo/Logo%20WorkSim_dark.png" alt="WorkSim Logo Dark" />
        </a>
      </div>
      <div class="flex lg:flex-1 justify-end items-center gap-4">
        <button onclick="toggleTheme()" class="rounded-full p-2 text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors bg-white/50 dark:bg-slate-800/50 backdrop-blur border border-slate-200 dark:border-slate-700">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:block"></i>
        </button>
      </div>
    </nav>
  </header>

  <!-- Konten Utama: Form Register -->
  <main class="flex-grow flex items-center justify-center p-4 relative z-10 my-16">
    <div class="w-full max-w-md">
      
      <!-- Card Container dengan Glassmorphism -->
      <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/50 dark:border-slate-700/50 p-8 sm:p-10 transform transition-all hover:scale-[1.01]">
        
        <!-- Header -->
        <div class="text-center mb-8">
          <h2 class="font-display text-3xl font-bold text-slate-900 dark:text-white mb-2">Mulai Perjalananmu</h2>
          <p class="text-slate-500 dark:text-slate-400 text-sm">Buat akun WorkSim secara gratis sekarang.</p>
        </div>

        <!-- Form -->
        <form class="space-y-5" action="login.html" method="GET">
          <!-- Input Nama Lengkap -->
          <div>
            <label for="name" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Nama Lengkap</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i class="fa-regular fa-user"></i>
              </div>
              <input type="text" id="name" name="name" required placeholder="Budi Santoso" 
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm" />
            </div>
          </div>

          <!-- Input Email -->
          <div>
            <label for="email" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Alamat Email</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <input type="email" id="email" name="email" required placeholder="nama@email.com" 
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm" />
            </div>
          </div>

          <!-- Input Password -->
          <div>
            <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Kata Sandi</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-lock"></i>
              </div>
              <input type="password" id="password" name="password" required placeholder="Minimal 8 karakter" minlength="8"
                class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all shadow-sm" />
              <!-- Mata untuk toggle password (opsional/hanya UI) -->
              <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
                <i class="fa-regular fa-eye"></i>
              </div>
            </div>
            <p class="mt-1.5 text-[0.65rem] text-slate-500 dark:text-slate-400">Pastikan gunakan kombinasi huruf dan angka yang aman.</p>
          </div>

          <!-- Term & Condition Checkbox -->
          <div class="flex items-start gap-2 mt-2">
            <div class="flex items-center h-5 mt-0.5">
              <input id="terms" name="terms" type="checkbox" required class="w-4 h-4 border border-slate-300 rounded bg-slate-50 focus:ring-3 focus:ring-brand-300 dark:bg-slate-700 dark:border-slate-600 dark:focus:ring-brand-600 dark:ring-offset-slate-800 cursor-pointer">
            </div>
            <label for="terms" class="text-xs text-slate-600 dark:text-slate-400 cursor-pointer leading-tight">
              Saya setuju dengan <a href="#" class="font-semibold text-brand-500 hover:underline">Syarat & Ketentuan</a> serta <a href="#" class="font-semibold text-brand-500 hover:underline">Kebijakan Privasi</a> yang berlaku.
            </label>
          </div>

          <!-- Tombol Submit -->
          <div class="pt-2">
            <button type="submit" class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-lg shadow-brand-500/30 text-sm font-bold text-white bg-brand-500 hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all hover:-translate-y-0.5">
              <span>Buat Akun</span>
              <i class="fa-solid fa-user-plus"></i>
            </button>
          </div>
        </form>

        <!-- Divider -->
        <div class="mt-6 relative flex items-center">
          <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
          <span class="flex-shrink-0 mx-4 text-slate-400 text-sm">Atau daftar dengan</span>
          <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
        </div>

        <!-- Social Login -->
        <div class="mt-5 grid grid-cols-2 gap-4">
          <button class="flex items-center justify-center gap-2 px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-xl bg-white/50 dark:bg-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-sm transition-colors shadow-sm">
            <i class="fa-brands fa-google text-red-500"></i> Google
          </button>
          <button class="flex items-center justify-center gap-2 px-4 py-2 border border-slate-200 dark:border-slate-700 rounded-xl bg-white/50 dark:bg-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-sm transition-colors shadow-sm">
            <i class="fa-brands fa-github"></i> GitHub
          </button>
        </div>

      </div> <!-- End Card -->

      <!-- Link Login -->
      <p class="mt-8 text-center text-sm text-slate-600 dark:text-slate-400">
        Sudah punya akun? 
        <a href="login.html" class="font-bold text-brand-500 hover:text-brand-600 dark:hover:text-brand-400 transition-colors border-b border-transparent hover:border-brand-500 pb-0.5">Masuk di sini</a>
      </p>

    </div>
  </main>

</body>
</html>
